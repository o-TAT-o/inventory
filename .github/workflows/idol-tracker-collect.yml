name: idol-tracker collect

on:
  workflow_dispatch:
    inputs:
      name:
        description: "人名（例: 川名凜）。空欄なら登録済みの全員を更新"
        required: false
      slug:
        description: "ID（半角英数と_。例: rin_kawana）。公式プロフィールURLの末尾に合わせると公式ページを必ず取得できる"
        required: false
      group:
        description: "グループID（apps/idol-tracker/config/groups.yaml のキー）"
        required: false
        default: angerme
      use_ai:
        description: "AI抽出を使う"
        type: boolean
        default: true
  schedule:
    - cron: "0 21 * * 0"   # 毎週月曜 6:00 JST に全員を更新

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: idol-tracker-collect
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/idol-tracker

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/idol-tracker/pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Restore page cache
        uses: actions/cache@v4
        with:
          path: apps/idol-tracker/work/cache
          key: pages-${{ github.run_id }}
          restore-keys: pages-

      - name: Test
        run: python -m unittest discover tests

      - name: Collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'brave' }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL || 'claude-haiku-4-5-20251001' }}
          IN_NAME: ${{ inputs.name }}
          IN_SLUG: ${{ inputs.slug }}
          IN_GROUP: ${{ inputs.group || 'angerme' }}
          IN_AI: ${{ github.event_name == 'schedule' || inputs.use_ai }}
        run: |
          ARGS=()
          if [ "$IN_AI" != "true" ]; then ARGS+=(--no-ai); fi
          if [ -n "$IN_NAME" ]; then
            if [ -z "$IN_SLUG" ]; then echo "::error::slug を入力してください"; exit 1; fi
            python -m pipeline.collect --name "$IN_NAME" --slug "$IN_SLUG" --group "$IN_GROUP" "${ARGS[@]}"
          else
            python -m pipeline.collect --all "${ARGS[@]}"
          fi
          echo "BRANCH=collect/${IN_SLUG:-all}-$(date +%Y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH }}
          commit-message: "chore(apps/idol-tracker): 収集結果 ${{ inputs.name || '全員を更新' }}"
          title: "収集結果: ${{ inputs.name || '全員を更新' }}"
          body-path: apps/idol-tracker/work/report.md
          add-paths: |
            apps/idol-tracker/claims/**
            apps/idol-tracker/manual/**
            apps/idol-tracker/docs/data/**
          delete-branch: true
