name: idol-tracker pages

# モノレポなので Pages の「Deploy from a branch（/docs）」は使えない。
# apps/idol-tracker/docs だけをアーティファクトとして Pages に配信する。
# Source（GitHub Actions）の有効化は configure-pages の enablement で自動的に行う。

on:
  push:
    branches: [main]
    paths:
      - "apps/idol-tracker/docs/**"
      - ".github/workflows/idol-tracker-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Pages 未設定でも、このワークフローが build_type=workflow で有効化する
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/idol-tracker/docs
      - id: deployment
        uses: actions/deploy-pages@v4
