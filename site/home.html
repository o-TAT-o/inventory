<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{SITE_TITLE}}</title>
<meta name="description" content="{{SITE_DESCRIPTION}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root{
  /* ホームは路線図。公開しているページを、カテゴリごとの路線に並ぶ駅として見せる */
  --bg:#F2F4F6;
  --surface:#FFFFFF;
  --ink:#14202C;
  --muted:#5A6977;
  --rule:#D3DAE1;
  --line:#0A6FB8;
  --font-display:"Dela Gothic One","BIZ UDPGothic",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#151F29; --ink:#E2E9EF; --muted:#94A4B3; --rule:#2B3946; --line:#4AB0EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#151F29; --ink:#E2E9EF; --muted:#94A4B3; --rule:#2B3946; --line:#4AB0EE;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;padding:44px clamp(16px,4vw,32px) 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
header{display:grid;gap:10px}
h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:clamp(40px,8vw,64px);line-height:1.1;letter-spacing:.03em}
.lead{margin:0;color:var(--muted);max-width:60ch}
.group{display:grid;gap:12px}
.group h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.line{list-style:none;margin:0;padding:0;display:grid;gap:12px;position:relative}
.line::before{content:"";position:absolute;left:15px;top:26px;bottom:26px;width:6px;border-radius:3px;background:var(--rule)}
.line:has(> li:only-child)::before{display:none}
.stop{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start;position:relative}
.st{width:36px;height:36px;border-radius:50%;border:6px solid var(--line);background:var(--surface);margin-top:16px}
.card{display:grid;gap:6px;padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;text-decoration:none;color:var(--ink);transition:border-color .15s}
.card:hover{border-color:var(--line)}
.card:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.card .t{font-size:19px;font-weight:700;line-height:1.4;text-wrap:balance}
.card .d{color:var(--muted);font-size:14px}
.card .go{font-size:13px;font-weight:700;color:var(--line)}
footer{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
footer a{color:var(--line)}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>{{SITE_TITLE}}</h1>
    <p class="lead">{{SITE_DESCRIPTION}}</p>
  </header>
{{SECTIONS}}
  <footer>{{FOOTER}}</footer>
</div>
</body>
</html>
