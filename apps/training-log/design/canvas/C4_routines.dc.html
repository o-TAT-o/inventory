<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — ルーティン一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:16px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.seg{display:flex;margin:4px 16px 8px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;height:48px}
.seg button{flex:1;text-align:center;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--con);color:var(--oncon);font-weight:700}
.rt{display:flex;align-items:center;min-height:80px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.rt .main{flex:1;min-width:0;min-height:72px;display:flex;flex-direction:column;justify-content:center}
.rt .main b{font-size:17px;display:flex;align-items:center;gap:8px}
.rt .main small{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{font-size:11px;font-weight:700;background:var(--pri);color:var(--onpri);border-radius:999px;padding:0 8px}
.go{width:48px;height:48px;border-radius:50%;background:var(--con);color:var(--oncon);display:grid;place-items:center;flex:none}
.fab{position:absolute;right:16px;bottom:88px;display:flex;align-items:center;gap:8px;height:56px;padding:0 20px 0 16px;border-radius:18px;background:var(--pri);color:var(--onpri);font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.nav{height:72px;flex:none;display:flex;background:var(--sf);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub);text-align:center}
.nav button span{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav .on{color:var(--fg);font-weight:700}
.nav .on span{background:var(--con);color:var(--oncon)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"></path></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"></path></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar"><div class="ttl">ルーティン</div></div>
  <div class="seg" role="group" aria-label="表示"><button type="button" aria-pressed="true">ルーティン</button><button type="button" aria-pressed="false">種目</button></div>
  <div class="scr">
    <div class="rt">
      <button type="button" class="ib" aria-label="Push を並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
      <button type="button" class="main"><b>Push<span class="next">次</span></b><small>ベンチプレス · インクラインダンベルプレス</small><small>2 種目 · 前回 11/7（土）</small></button>
      <button type="button" class="go" aria-label="Push を始める"><svg class="i f" aria-hidden="true"><use href="#play"></use></svg></button>
    </div>
    <div class="rt">
      <button type="button" class="ib" aria-label="Pull を並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
      <button type="button" class="main"><b>Pull</b><small>ラットプルダウン · ワンハンドダンベルロウ · 懸垂</small><small>3 種目 · 前回 11/11（水）</small></button>
      <button type="button" class="go" aria-label="Pull を始める"><svg class="i f" aria-hidden="true"><use href="#play"></use></svg></button>
    </div>
    <div class="rt">
      <button type="button" class="ib" aria-label="Legs を並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
      <button type="button" class="main"><b>Legs</b><small>スクワット · プランク</small><small>2 種目 · 前回 11/12（木）</small></button>
      <button type="button" class="go" aria-label="Legs を始める"><svg class="i f" aria-hidden="true"><use href="#play"></use></svg></button>
    </div>
  </div>
  <button type="button" class="fab"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg>ルーティンを作る</button>
  <div class="nav">
    <button type="button"><span><svg class="i" aria-hidden="true"><use href="#home"></use></svg></span>今日</button>
    <button type="button" class="on"><span><svg class="i" aria-hidden="true"><use href="#list"></use></svg></span>ルーティン</button>
    <button type="button"><span><svg class="i" aria-hidden="true"><use href="#cal"></use></svg></span>履歴</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
