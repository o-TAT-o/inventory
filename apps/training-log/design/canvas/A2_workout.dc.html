<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A ノート — ワークアウト記録</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{width:360px;height:780px;overflow:hidden;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dA{--bg:#F6F4EC;--sf:#FFFFFF;--sf2:#ECE9DD;--fg:#1C1F1A;--sub:#55594F;--pri:#2F5D3A;--onpri:#FFFFFF;--con:#D5E6D2;--oncon:#12301B;--line:#C9C6B8}
.app.dA.dark{--bg:#141612;--sf:#1E211C;--sf2:#2A2E27;--fg:#E6E4DA;--sub:#A9AD9F;--pri:#A5D0A8;--onpri:#0F2A16;--con:#2B4531;--oncon:#CFE8CF;--line:#40443C}
.scr{flex:1;overflow:hidden;min-height:0}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.i.s{width:18px;height:18px}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.bar .time{font-size:15px;color:var(--sub);padding-right:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--fg)}
.tb{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pri);border-radius:999px;white-space:nowrap}
.sub{color:var(--sub)}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--fg);border-radius:999px;padding:1px 7px 1px 4px;white-space:nowrap}
.pb .i{width:13px;height:13px}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--con);color:var(--oncon);border-color:transparent;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px}
.btn.fill{background:var(--pri);color:var(--onpri)}
.stp{display:flex;align-items:center;gap:6px}
.stp .pm{width:56px;height:56px;border-radius:16px;background:var(--sf2);display:grid;place-items:center;flex:none}
.stp .val{flex:1;text-align:center;line-height:1.15}
.stp .val b{font-size:28px;font-weight:700}
.stp .val small{display:block;font-size:12px;color:var(--sub)}
.prog{height:3px;background:var(--sf2)}
.prog::after{content:'';display:block;height:100%;width:40%;background:var(--pri)}
.dA .memo{margin:0 12px 8px;padding:0 4px 0 12px;min-height:40px;display:flex;align-items:center;gap:8px;background:var(--sf2);border-radius:12px;font-size:13px}
.dA .memo span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dA .card{margin:0 12px 10px;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:4px 12px 12px}
.dA .ch{display:flex;align-items:center;min-height:48px;margin:0 -8px}
.dA .ch .nm{flex:1;font-size:16px;font-weight:700}
.dA .ch .nm small{font-size:12px;font-weight:400;color:var(--sub);margin-left:6px}
.dA .prev{font-size:13px;color:var(--sub);margin-bottom:8px}
.dA .chips{display:flex;gap:6px;margin-bottom:6px}
.dA .row{display:grid;grid-template-columns:24px 1fr 64px 116px;align-items:center;min-height:40px;border-top:1px solid var(--line);font-size:15px}
.dA .row .no{color:var(--sub);font-size:13px}
.dA .row b{font-weight:700}
.dA .row .st{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.dA .row.todo{color:var(--sub)}
.dA .ring{width:20px;height:20px;border:2px solid var(--line);border-radius:50%}
.dA .next{border:2px solid var(--pri);border-radius:14px;padding:8px 10px 10px;margin-top:4px}
.dA .next .lbl{font-size:12px;font-weight:700;margin-bottom:6px}
.dA .next .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.dA .next .stp .pm{width:48px;height:52px;border-radius:14px}
.dA .next .stp .val b{font-size:22px}
.dA .next .stp{gap:2px}
.dA .timer{flex:none;background:var(--sf);border-top:1px solid var(--line)}
.dA .timer .in{display:flex;align-items:center;padding:6px 4px 6px 16px;gap:2px}
.dA .timer .t{flex:1;display:flex;align-items:baseline;gap:8px;font-size:13px}
.dA .timer .t b{font-size:26px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"></path></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></symbol>
  <symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"></circle><path d="M12 9v4l2.5 2M9.5 3h5"></path></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1-5.5-3-5.5 3 1.2-6.1-4.5-4.2 6.1-.8z"></path></symbol>
  <symbol id="skip" viewBox="0 0 24 24"><path d="M6 6l8 6-8 6zM18 6v12"></path></symbol>
</svg>
<div class="app dA {{themeClass}}">
  <div class="bar">
    <div class="ib"><svg class="i"><use href="#back"></use></svg></div>
    <div class="ttl">Push</div><div class="time">24:10</div>
    <div class="tb">終える</div>
  </div>
  <div class="memo"><span>メモ: ベンチが空いていなければダンベルプレスに変更</span><div class="ib" style="width:40px;height:40px"><svg class="i"><use href="#down"></use></svg></div></div>
  <div class="scr">
    <div class="card">
      <div class="ch">
        <div class="ib"><svg class="i sub"><use href="#drag"></use></svg></div>
        <div class="nm">ベンチプレス<small>バーベル</small></div>
        <div class="ib"><svg class="i"><use href="#more"></use></svg></div>
      </div>
      <div class="prev">前回 11/7: 60×10・60×9・60×8 kg <i class="tag">合計</i></div>
      <div class="chips"><span class="chip on"><svg class="i s"><use href="#check"></use></svg>リストラップ</span><span class="chip">ベルト</span><span class="chip">＋ メモ</span></div>
      <div class="row"><span class="no">1</span><span><b>62.5</b> kg <i class="tag">合計</i></span><span><b>10</b> 回</span><span class="st"><em class="pb"><svg class="i f"><use href="#star"></use></svg>自己ベスト</em><svg class="i s"><use href="#check"></use></svg></span></div>
      <div class="row"><span class="no">2</span><span><b>62.5</b> kg <i class="tag">合計</i></span><span><b>9</b> 回</span><span class="st"><svg class="i s"><use href="#check"></use></svg></span></div>
      <div class="next">
        <div class="lbl">3 セット目</div>
        <div class="two">
          <div class="stp"><div class="pm"><svg class="i"><use href="#minus"></use></svg></div><div class="val"><b>62.5</b><small>kg 合計</small></div><div class="pm"><svg class="i"><use href="#plus"></use></svg></div></div>
          <div class="stp"><div class="pm"><svg class="i"><use href="#minus"></use></svg></div><div class="val"><b>9</b><small>回</small></div><div class="pm"><svg class="i"><use href="#plus"></use></svg></div></div>
        </div>
        <div class="btn fill"><svg class="i"><use href="#check"></use></svg>完了</div>
      </div>
    </div>
    <div class="card">
      <div class="ch">
        <div class="ib"><svg class="i sub"><use href="#drag"></use></svg></div>
        <div class="nm">インクラインダンベルプレス<small>ダンベル</small></div>
        <div class="ib"><svg class="i"><use href="#more"></use></svg></div>
      </div>
      <div class="prev">前回 11/7: 20 kg <i class="tag">片手</i> × 10 を 3 セット</div>
      <div class="chips"><span class="chip">ベンチ角度 30°</span></div>
      <div class="row todo"><span class="no">1</span><span><b>20</b> kg <i class="tag">片手</i></span><span><b>10</b> 回</span><span class="st"><span class="ring"></span></span></div>
    </div>
  </div>
  <div class="timer">
    <div class="prog"></div>
    <div class="in">
      <div class="t"><svg class="i s" style="align-self:center"><use href="#timer"></use></svg>休憩<b>1:12</b></div>
      <div class="tb">−10 秒</div><div class="tb">＋10 秒</div>
      <div class="ib" title="止める"><svg class="i"><use href="#skip"></use></svg></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
