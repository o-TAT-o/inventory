<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — 記録（休憩おわり）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.i.s{width:18px;height:18px}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .time{font-size:15px;color:var(--sub);padding-right:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.tb{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pri);border-radius:999px;white-space:nowrap}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--fg);border-radius:999px;padding:1px 7px 1px 4px;white-space:nowrap}
.pb .i{width:13px;height:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px;text-align:center}
.btn.fill{background:var(--pri);color:var(--onpri)}
.btn.line{border:1.5px solid var(--line)}
.memo{padding:0 4px 0 16px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.memo span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.eh{display:flex;align-items:center;padding:6px 0 2px 4px}
.eh .nm{flex:1;min-width:0}
.eh .nm b{font-size:15px;display:block}
.eh .nm small{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{display:grid;grid-template-columns:28px 1fr auto;align-items:center;width:calc(100% - 24px);min-height:44px;margin:0 12px;padding:0 8px;font-size:15px;border-radius:10px}
.r .no{color:var(--sub);font-size:13px}
.r .st{display:flex;align-items:center;gap:6px}
.r.todo{color:var(--sub)}
.r.sel{background:var(--con);color:var(--oncon);font-weight:700}
.r.sel .no{color:inherit}
.ring{width:18px;height:18px;border:2px solid var(--line);border-radius:50%}
.sep{height:1px;background:var(--line);margin:6px 0 0}
.add{display:flex;align-items:center;justify-content:center;gap:6px;width:calc(100% - 24px);min-height:48px;margin:10px 12px 0;border:1.5px dashed var(--line);border-radius:12px;color:var(--sub);font-weight:600}
.dock{flex:none;background:var(--sf);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);overflow:hidden}
.rest{display:flex;align-items:center;min-height:48px;padding:0 4px 0 16px;font-size:13px;gap:2px;background:var(--sf2)}
.rest b{font-size:20px;margin:0 auto 0 8px}
.rest.end{background:var(--pri);color:var(--onpri);font-weight:700}
.rest.end .tb{color:var(--onpri)}
.prog{height:3px;background:var(--sf2)}
.prog i{display:block;height:100%;background:var(--pri)}
.ctx{display:flex;align-items:center;padding:4px 4px 0}
.ctx .t{flex:1;min-width:0;min-height:48px;text-align:center}
.ctx .t b{display:block;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctx .t small{font-size:12px;color:var(--sub)}
.dock .body{padding:4px 12px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stp{display:flex;align-items:center}
.stp .pm{width:48px;height:56px;border-radius:16px;background:var(--sf2);display:grid;place-items:center;flex:none}
.stp .val{flex:1;text-align:center;line-height:1.15}
.stp .val b{font-size:24px;font-weight:700}
.stp .val small{display:block;font-size:12px;color:var(--sub)}
.row2{display:flex;gap:8px}
.row2 .more{width:64px;flex:none;min-height:60px;flex-direction:column;gap:0;font-size:11px;padding:0}
.row2 .go{flex:1;width:auto;min-height:60px;font-size:18px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"></path></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"></path></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></symbol>
  <symbol id="bell" viewBox="0 0 24 24"><path d="M6 17h12l-1.5-2V11a4.5 4.5 0 0 0-9 0v4zM10 20h4"></path></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1-5.5-3-5.5 3 1.2-6.1-4.5-4.2 6.1-.8z"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="戻る"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">Push</div><div class="time">25:30</div>
    <button type="button" class="tb">終える</button>
  </div>
  <div class="memo"><span>メモ: ベンチが空いていなければダンベルプレスに変更</span><button type="button" class="ib" style="width:44px;height:44px" aria-label="メモをひらく"><svg class="i" aria-hidden="true"><use href="#down"></use></svg></button></div>
  <div class="scr">
    <div class="eh">
      <button type="button" class="ib" aria-label="ベンチプレスを並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
      <button type="button" class="nm"><b>ベンチプレス</b><small>バーベル · リストラップ</small><small>前回 11/7　60×10 · 60×9 · 60×8 kg 合計 ›</small></button>
      <button type="button" class="ib" aria-label="ベンチプレスのメニュー"><svg class="i" aria-hidden="true"><use href="#more"></use></svg></button>
    </div>
    <button type="button" class="r"><span class="no">1</span><span><b>62.5</b> kg <i class="tag">合計</i> × <b>10</b> 回</span><span class="st"><em class="pb"><svg class="i f" aria-hidden="true"><use href="#star"></use></svg>自己ベスト</em><svg class="i s" aria-hidden="true"><use href="#check"></use></svg></span></button>
    <button type="button" class="r"><span class="no">2</span><span><b>62.5</b> kg <i class="tag">合計</i> × <b>9</b> 回</span><span class="st"><svg class="i s" aria-hidden="true"><use href="#check"></use></svg></span></button>
    <button type="button" class="r sel"><span class="no">3</span><span>62.5 kg × 9 回</span><span class="st" style="font-size:12px">入力中</span></button>
    <div class="sep"></div>
    <div class="eh">
      <button type="button" class="ib" aria-label="インクラインダンベルプレスを並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
      <button type="button" class="nm"><b>インクラインダンベルプレス</b><small>ダンベル · ベンチ角度 30°</small><small>前回 11/7　20 kg 片手 × 10 を 3 セット ›</small></button>
      <button type="button" class="ib" aria-label="インクラインダンベルプレスのメニュー"><svg class="i" aria-hidden="true"><use href="#more"></use></svg></button>
    </div>
    <button type="button" class="r todo"><span class="no">1</span><span>20 kg <i class="tag">片手</i> × 10 回</span><span class="st"><span class="ring"></span></span></button>
    <button type="button" class="r todo"><span class="no">2</span><span>20 kg <i class="tag">片手</i> × 10 回</span><span class="st"><span class="ring"></span></span></button>
    <button type="button" class="r todo"><span class="no">3</span><span>20 kg <i class="tag">片手</i> × 10 回</span><span class="st"><span class="ring"></span></span></button>
    <button type="button" class="add"><svg class="i s" aria-hidden="true"><use href="#plus"></use></svg>種目を追加</button>
  </div>
  <div class="dock">
    <div class="rest end">
      <svg class="i s" aria-hidden="true"><use href="#bell"></use></svg>&nbsp;休憩おわり<b>+0:08</b>
      <button type="button" class="tb">＋30 秒</button>
      <button type="button" class="ib" aria-label="休憩の表示を閉じる"><svg class="i" aria-hidden="true"><use href="#close"></use></svg></button>
    </div>
    <div class="prog"><i style="width:100%"></i></div>
    <div class="ctx">
      <button type="button" class="ib" aria-label="前の種目へ"><svg class="i" aria-hidden="true"><use href="#left"></use></svg></button>
      <button type="button" class="t"><b>ベンチプレス　3 セット目</b><small>前回 60 kg × 8 ›</small></button>
      <button type="button" class="ib" aria-label="次の種目へ"><svg class="i" aria-hidden="true"><use href="#right"></use></svg></button>
    </div>
    <div class="body">
      <div class="two">
        <div class="stp"><button type="button" class="pm" aria-label="重量を下げる"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><div class="val"><b>62.5</b><small>kg 合計</small></div><button type="button" class="pm" aria-label="重量を上げる"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
        <div class="stp"><button type="button" class="pm" aria-label="回数を減らす"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><div class="val"><b>9</b><small>回</small></div><button type="button" class="pm" aria-label="回数を増やす"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
      </div>
      <div class="row2">
        <button type="button" class="btn line more"><svg class="i" aria-hidden="true"><use href="#up"></use></svg>詳細</button>
<button type="button" class="btn line more"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg>セット</button>
        <button type="button" class="btn fill go"><svg class="i" aria-hidden="true"><use href="#check"></use></svg>完了</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
