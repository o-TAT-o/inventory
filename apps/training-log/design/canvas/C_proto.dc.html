<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — 操作できる試作</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
sc-if,sc-for{display:contents}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.i.s{width:18px;height:18px}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.bar .time{font-size:15px;color:var(--sub);padding-right:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.tb{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pri);border-radius:999px;white-space:nowrap}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--fg);border-radius:999px;padding:1px 7px 1px 4px;white-space:nowrap}
.pb .i{width:13px;height:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px;text-align:center}
.btn.fill{background:var(--pri);color:var(--onpri)}
.btn.line{border:1.5px solid var(--line)}
.memo{padding:0 4px 0 16px;min-height:44px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.memo span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.eh{display:flex;align-items:center;padding:8px 0 2px 4px;margin-top:4px;border-top:1px solid var(--line)}
.eh .nm{flex:1;min-width:0}
.eh .nm b{font-size:15px;display:block}
.eh .nm small{font-size:12px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{display:grid;grid-template-columns:28px 1fr auto;align-items:center;width:calc(100% - 24px);min-height:44px;margin:0 12px;padding:0 8px;font-size:15px;border-radius:10px}
.r .no{color:var(--sub);font-size:13px}
.r .st{display:flex;align-items:center;gap:6px}
.r.todo{color:var(--sub)}
.r.sel{background:var(--con);color:var(--oncon);font-weight:700}
.r.sel .no{color:inherit}
.ring{width:18px;height:18px;border:2px solid var(--line);border-radius:50%}
.ing{font-size:12px}
.gh{display:flex;align-items:center;gap:8px;width:calc(100% - 24px);min-height:44px;margin:0 12px;padding:0 8px 0 4px;border-radius:10px;color:var(--sub);font-size:14px;font-weight:600}
.gh .p{width:28px;display:grid;place-items:center}
.dock{flex:none;background:var(--sf);border-top:1px solid var(--line);border-radius:24px 24px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.12);overflow:hidden}
.rest{display:flex;align-items:center;min-height:48px;padding:0 4px 0 16px;font-size:13px;gap:2px;background:var(--sf2)}
.rest b{font-size:20px;margin:0 auto 0 8px}
.rest.end{background:var(--pri);color:var(--onpri);font-weight:700}
.rest.end .tb{color:var(--onpri)}
.prog{height:3px;background:var(--sf2)}
.prog i{display:block;height:100%;background:var(--pri)}
.ctx{display:flex;align-items:center;padding:4px 4px 0}
.ctx .t{flex:1;min-width:0;text-align:center}
.ctx .t b{display:block;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ctx .t small{font-size:12px;color:var(--sub)}
.dock .body{padding:4px 12px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stp{display:flex;align-items:center}
.stp .pm{width:48px;height:56px;border-radius:16px;background:var(--sf2);display:grid;place-items:center;flex:none}
.stp .val{flex:1;text-align:center;line-height:1.15}
.stp .val b{font-size:24px;font-weight:700}
.stp .val small{display:block;font-size:12px;color:var(--sub)}
.row2{display:flex;gap:8px}
.row2 .more{width:64px;flex:none;min-height:60px;flex-direction:column;gap:0;font-size:11px;padding:0}
.row2 .more2{width:112px;flex:none;min-height:60px;font-size:15px;padding:0}
.row2 .go{flex:1;width:auto;min-height:60px;font-size:17px}
.fin{padding:14px 16px 0;text-align:center}
.fin b{display:block;font-size:17px}
.fin small{font-size:13px;color:var(--sub)}
.scrim{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.5)}
.endcard{position:absolute;left:24px;right:24px;top:240px;background:var(--sf);border-radius:24px;padding:24px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
.endcard b{font-size:20px}
.endcard p{font-size:14px;color:var(--sub)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"></path></symbol>
  <symbol id="left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></symbol>
  <symbol id="timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"></circle><path d="M12 9v4l2.5 2M9.5 3h5"></path></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1-5.5-3-5.5 3 1.2-6.1-4.5-4.2 6.1-.8z"></path></symbol>
  <symbol id="skip" viewBox="0 0 24 24"><path d="M6 6l8 6-8 6zM18 6v12"></path></symbol>
  <symbol id="close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="戻る"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">Push</div><div class="time">24:10</div>
    <button type="button" class="tb" onClick="{{doEnd}}">終える</button>
  </div>
  <div class="memo"><span>メモ: ベンチが空いていなければダンベルプレスに変更</span><button type="button" class="ib" style="width:44px;height:44px" aria-label="メモをひらく"><svg class="i" aria-hidden="true"><use href="#down"></use></svg></button></div>
  <div class="scr">
    <sc-for list="{{rows}}" as="it" hint-placeholder-count="8">
      <sc-if value="{{it.isHead}}" hint-placeholder-val="{{ true }}">
        <div class="eh">
          <span class="ib"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></span>
          <div class="nm"><b>{{it.name}}</b><small>{{it.meta}}</small><small>{{it.prev}}</small></div>
        </div>
      </sc-if>
      <sc-if value="{{it.isSet}}" hint-placeholder-val="{{ true }}">
        <button type="button" class="r {{it.cls}}" onClick="{{it.pick}}">
          <span class="no">{{it.no}}</span>
          <span><b>{{it.w}}</b> kg <i class="tag">{{it.tag}}</i> × <b>{{it.r}}</b> 回</span>
          <span class="st">
            <sc-if value="{{it.pb}}" hint-placeholder-val="{{ false }}"><em class="pb"><svg class="i f" aria-hidden="true"><use href="#star"></use></svg>自己ベスト</em></sc-if>
            <sc-if value="{{it.done}}" hint-placeholder-val="{{ false }}"><svg class="i s" aria-hidden="true"><use href="#check"></use></svg></sc-if>
            <sc-if value="{{it.isSel}}" hint-placeholder-val="{{ false }}"><span class="ing">入力中</span></sc-if>
            <sc-if value="{{it.isTodo}}" hint-placeholder-val="{{ false }}"><span class="ring"></span></sc-if>
          </span>
        </button>
      </sc-if>    </sc-for>
  </div>
  <div class="dock">
    <sc-if value="{{hasRest}}" hint-placeholder-val="{{ true }}">
      <div class="rest {{restCls}}">
        <svg class="i s" aria-hidden="true"><use href="#timer"></use></svg>&nbsp;<span>{{restLabel}}</span><b>{{restText}}</b>
        <sc-if value="{{isRunning}}" hint-placeholder-val="{{ true }}">
          <button type="button" class="tb" onClick="{{doMinus10}}">−10 秒</button>
          <button type="button" class="tb" onClick="{{doPlus10}}">＋10 秒</button>
          <button type="button" class="ib" aria-label="休憩をとばす" onClick="{{doSkip}}"><svg class="i" aria-hidden="true"><use href="#skip"></use></svg></button>
        </sc-if>
        <sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
          <button type="button" class="tb" onClick="{{doPlus30}}">＋30 秒</button>
          <button type="button" class="ib" aria-label="休憩の表示を閉じる" onClick="{{doSkip}}"><svg class="i" aria-hidden="true"><use href="#close"></use></svg></button>
        </sc-if>
      </div>
      <div class="prog"><i style="{{restStyle}}"></i></div>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <div class="ctx">
        <button type="button" class="ib" aria-label="前の種目へ" onClick="{{doPrev}}"><svg class="i" aria-hidden="true"><use href="#left"></use></svg></button>
        <div class="t"><b>{{ctxTitle}}</b><small>{{ctxSub}}</small></div>
        <button type="button" class="ib" aria-label="次の種目へ" onClick="{{doNext}}"><svg class="i" aria-hidden="true"><use href="#right"></use></svg></button>
      </div>
      <div class="body">
        <div class="two">
          <div class="stp"><button type="button" class="pm" aria-label="重量を下げる" onClick="{{doWm}}"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><div class="val"><b>{{wText}}</b><small>{{unitW}}</small></div><button type="button" class="pm" aria-label="重量を上げる" onClick="{{doWp}}"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
          <div class="stp"><button type="button" class="pm" aria-label="回数を減らす" onClick="{{doRm}}"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><div class="val"><b>{{rText}}</b><small>回</small></div><button type="button" class="pm" aria-label="回数を増やす" onClick="{{doRp}}"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
        </div>
        <div class="row2">
          <button type="button" class="btn line more"><svg class="i" aria-hidden="true"><use href="#up"></use></svg>詳細</button>
          <button type="button" class="btn line more" onClick="{{doAddCur}}"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg>セット</button>
          <button type="button" class="btn fill go" onClick="{{doComplete}}"><svg class="i" aria-hidden="true"><use href="#check"></use></svg>完了</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
      <div class="fin"><b>すべてのセットが終わりました</b><small>{{finText}}</small></div>
      <div class="body" style="padding-top:12px">
        <div class="row2">
          <button type="button" class="btn line more2" onClick="{{doAddSet}}">もう1セット</button>
          <button type="button" class="btn fill go" onClick="{{doEnd}}"><svg class="i" aria-hidden="true"><use href="#check"></use></svg>ワークアウトを終える</button>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ended}}" hint-placeholder-val="{{ false }}">
    <div class="scrim"></div>
    <div class="endcard">
      <b>ここまでが試作です</b>
      <p>「ワークアウトを終える」のあとは、「ワークアウト完了」の画面につながります。</p>
      <button type="button" class="btn fill" onClick="{{doReset}}">最初からやり直す</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  info() {
    return {
      names: ['ベンチプレス', 'インクラインダンベルプレス'],
      metas: ['バーベル · リストラップ', 'ダンベル · ベンチ角度 30°'],
      prevs: ['前回 11/7　60×10 · 60×9 · 60×8 kg 合計', '前回 11/7　20 kg 片手 × 10 を 3 セット'],
      shorts: ['前回 60 kg × 8', '前回 20 kg × 10'],
      units: ['kg 合計', 'kg 片手'],
      tags: ['合計', '片手'],
      steps: [2.5, 2]
    };
  }
  makeInitial() {
    return {
      sets: [
        [{ w: 62.5, r: 10, done: true, pb: true }, { w: 62.5, r: 9, done: true, pb: false }, { w: 62.5, r: 9, done: false, pb: false }],
        [{ w: 20, r: 10, done: false, pb: false }, { w: 20, r: 10, done: false, pb: false }, { w: 20, r: 10, done: false, pb: false }]
      ],
      best: [62.5, 22],
      w: 62.5, r: 9,
      focus: null,
      rest: 72, restLen: 90, restDone: false, over: 0,
      ended: false
    };
  }
  curState() {
    return (this.state && this.state.sets) ? this.state : this.makeInitial();
  }
  curPos(s) {
    const order = s.focus === null ? [0, 1] : [s.focus].concat([0, 1].filter((e) => e !== s.focus));
    for (let k = 0; k < order.length; k++) {
      const e = order[k];
      const i = s.sets[e].findIndex((x) => !x.done);
      if (i >= 0) return { e: e, i: i };
    }
    return null;
  }
  mmss(sec) {
    const m = Math.floor(sec / 60);
    const r = sec % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  componentDidMount() {
    this.setState(this.makeInitial());
    this._iv = setInterval(() => this.tickOnce(), 1000);
  }
  componentWillUnmount() {
    if (this._iv) clearInterval(this._iv);
  }
  tickOnce() {
    const s = this.curState();
    if (s.rest === null || s.ended) return;
    if (s.rest > 0) {
      const rest = s.rest - 1;
      this.setState({ rest: rest, restDone: rest === 0, over: 0 });
    } else {
      this.setState({ over: s.over + 1 });
    }
  }
  stepW(d) {
    const s = this.curState();
    this.setState({ w: Math.max(0, Math.round((s.w + d) * 10) / 10) });
  }
  stepR(d) {
    const s = this.curState();
    this.setState({ r: Math.max(0, s.r + d) });
  }
  addRest(d) {
    const s = this.curState();
    const rest = Math.max(0, (s.rest || 0) + d);
    this.setState({ rest: rest, restDone: rest === 0, over: 0 });
  }
  skipRest() {
    this.setState({ rest: null, restDone: false, over: 0 });
  }
  focusEx(e) {
    const s = this.curState();
    const i = s.sets[e].findIndex((x) => !x.done);
    if (i < 0) return;
    const p = this.curPos(s);
    if (p && p.e === e) return;
    this.setState({ focus: e, w: s.sets[e][i].w, r: s.sets[e][i].r });
  }
  shiftEx(dir) {
    const s = this.curState();
    const p = this.curPos(s);
    const base = p ? p.e : 0;
    const e = Math.min(1, Math.max(0, base + dir));
    if (e === base) return;
    this.focusEx(e);
  }
  finishSet() {
    const s = this.curState();
    const p = this.curPos(s);
    if (!p) return;
    const sets = s.sets.map((a) => a.map((x) => Object.assign({}, x)));
    const set = sets[p.e][p.i];
    set.done = true;
    set.w = s.w;
    set.r = s.r;
    const best = s.best.slice();
    if (set.w > best[p.e]) {
      sets[p.e].forEach((x) => { x.pb = false; });
      set.pb = true;
      best[p.e] = set.w;
    }
    const next = this.curPos({ sets: sets, focus: null });
    let w = s.w;
    let r = s.r;
    if (next && next.e !== p.e) {
      w = sets[next.e][next.i].w;
      r = sets[next.e][next.i].r;
    }
    this.setState({ sets: sets, best: best, w: w, r: r, focus: null, rest: next ? s.restLen : null, restDone: false, over: 0 });
  }
  addSet() {
    const s = this.curState();
    const sets = s.sets.map((a) => a.slice());
    const last = sets[1][sets[1].length - 1];
    sets[1].push({ w: last.w, r: last.r, done: false, pb: false });
    this.setState({ sets: sets, w: last.w, r: last.r, focus: null, ended: false });
  }
  addSetTo(e) {
    const s = this.curState();
    const sets = s.sets.map((a) => a.slice());
    const last = sets[e][sets[e].length - 1];
    sets[e].push({ w: last.w, r: last.r, done: false, pb: false });
    this.setState({ sets: sets, w: last.w, r: last.r, focus: e, ended: false });
  }
  endWorkout() {
    this.setState({ ended: true, rest: null, restDone: false, over: 0 });
  }
  resetAll() {
    this.setState(this.makeInitial());
  }
  renderVals() {
    const s = this.curState();
    const p = this.curPos(s);
    const d = this.info();
    const rows = [];
    let doneCount = 0;
    s.sets.forEach((list, e) => {
      rows.push({ isHead: true, isSet: false, isAdd: false, name: d.names[e], meta: d.metas[e], prev: d.prevs[e], no: '', w: '', r: '', tag: '', cls: '', done: false, pb: false, isSel: false, isTodo: false, pick: () => {} });
      list.forEach((x, i) => {
        const isCur = !!p && p.e === e && p.i === i;
        if (x.done) doneCount += 1;
        rows.push({
          isHead: false, isSet: true, isAdd: false, name: '', meta: '', prev: '',
          no: String(i + 1),
          w: String(isCur ? s.w : x.w),
          r: String(isCur ? s.r : x.r),
          tag: d.tags[e],
          cls: isCur ? 'sel' : (x.done ? '' : 'todo'),
          done: x.done, pb: x.done && x.pb, isSel: isCur, isTodo: !x.done && !isCur,
          pick: () => this.focusEx(e)
        });
      });
    });
    const hasRest = s.rest !== null;
    const isEnd = hasRest && s.restDone;
    const isRunning = hasRest && !s.restDone;
    const pct = !hasRest ? 0 : (s.restDone ? 100 : Math.round((s.restLen - s.rest) / s.restLen * 100));
    const step = p ? d.steps[p.e] : 2.5;
    return {
      themeClass: this.props.dark ? 'dark' : '',
      rows: rows,
      hasRest: hasRest, isRunning: isRunning, isEnd: isEnd,
      restCls: isEnd ? 'end' : '',
      restLabel: isEnd ? '休憩おわり' : '休憩',
      restText: isEnd ? '+' + this.mmss(s.over) : this.mmss(s.rest || 0),
      restStyle: 'width:' + pct + '%',
      notDone: !!p, allDone: !p,
      ctxTitle: p ? d.names[p.e] + '　' + (p.i + 1) + ' セット目' : '',
      ctxSub: p ? d.shorts[p.e] : '',
      wText: String(s.w), rText: String(s.r),
      unitW: p ? d.units[p.e] : '',
      finText: '2 種目 · ' + doneCount + ' セット',
      ended: s.ended,
      doComplete: () => this.finishSet(),
      doWm: () => this.stepW(-step), doWp: () => this.stepW(step),
      doRm: () => this.stepR(-1), doRp: () => this.stepR(1),
      doMinus10: () => this.addRest(-10), doPlus10: () => this.addRest(10), doPlus30: () => this.addRest(30),
      doSkip: () => this.skipRest(),
      doPrev: () => this.shiftEx(-1), doNext: () => this.shiftEx(1),
      doAddSet: () => this.addSet(),
      doAddCur: () => this.addSetTo(p ? p.e : 1),
      doEnd: () => this.endWorkout(),
      doReset: () => this.resetAll()
    };
  }
}
</script>
</body>
</html>
