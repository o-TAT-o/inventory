<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — 種目の詳細（記録中から開く）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.meta{padding:0 20px 8px;font-size:12px;color:var(--sub)}
.chips{display:flex;gap:8px;overflow:hidden;padding:0 16px}
.chip{display:inline-flex;align-items:center;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--con);color:var(--oncon);border-color:transparent;font-weight:600}
.seg{display:flex;margin:0 16px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;height:48px}
.seg button{flex:1;text-align:center;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--con);color:var(--oncon);font-weight:700}
.chart{margin:8px 16px 0;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:8px 4px 0}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--sub);font-size:11px}
.ln{stroke:var(--pri);fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pt{fill:var(--pri)}
.star{fill:var(--fg)}
.pbl{display:flex;align-items:center;gap:8px;margin:10px 20px 0;font-size:14px;flex-wrap:wrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--fg);border-radius:999px;padding:1px 7px 1px 4px;white-space:nowrap}
.pb .i{width:13px;height:13px}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.rec{margin-top:8px;border-top:1px solid var(--line)}
.rec button{display:block;width:100%;min-height:60px;padding:8px 20px;border-bottom:1px solid var(--line)}
.rec b{display:block;font-size:14px}
.rec small{font-size:12px;color:var(--sub)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:60px;border-radius:16px;font-size:18px;font-weight:700;padding:0 20px;text-align:center}
.btn.fill{background:var(--pri);color:var(--onpri)}
.foot{flex:none;padding:8px 16px 16px;background:var(--bg);border-top:1px solid var(--line)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="edit" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"></path></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1-5.5-3-5.5 3 1.2-6.1-4.5-4.2 6.1-.8z"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="記録にもどる"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">ベンチプレス</div>
    <button type="button" class="ib" aria-label="種目を編集する"><svg class="i" aria-hidden="true"><use href="#edit"></use></svg></button>
  </div>
  <div class="scr">
    <div class="meta">胸 · バーベル · 重量は合計 · 回数は通常</div>
    <div class="seg" role="group" aria-label="指標"><button type="button" aria-pressed="true">最大重量</button><button type="button" aria-pressed="false">推定 1RM</button><button type="button" aria-pressed="false">ボリューム</button></div>
    <div class="chips" style="margin-top:8px" aria-label="期間">
      <button type="button" class="chip" aria-pressed="false">1か月</button><button type="button" class="chip" aria-pressed="true">3か月</button><button type="button" class="chip" aria-pressed="false">1年</button><button type="button" class="chip" aria-pressed="false">全期間</button>
    </div>
    <div class="chart">
      <svg viewBox="0 0 328 162" width="100%" role="img" aria-label="最大重量の推移。9月は 50 kg、今日は 62.5 kg">
        <line class="gl" x1="40" y1="90" x2="322" y2="90"></line>
        <line class="gl" x1="40" y1="55" x2="322" y2="55"></line>
        <line class="gl" x1="40" y1="20" x2="322" y2="20"></line>
        <text class="tx" x="32" y="94" text-anchor="end">55</text>
        <text class="tx" x="32" y="59" text-anchor="end">60</text>
        <text class="tx" x="32" y="24" text-anchor="end">65</text>
        <text class="tx" x="4" y="12">kg</text>
        <polyline class="ln" points="40,125 65.1,125 90.2,107.5 115.4,107.5 140.5,90 165.6,90 190.7,90 215.8,72.5 240.9,72.5 266,55 291.1,55 316,37.5"></polyline>
        <circle class="pt" cx="40" cy="125" r="3"></circle><circle class="pt" cx="65.1" cy="125" r="3"></circle><circle class="pt" cx="90.2" cy="107.5" r="3"></circle><circle class="pt" cx="115.4" cy="107.5" r="3"></circle><circle class="pt" cx="140.5" cy="90" r="3"></circle><circle class="pt" cx="165.6" cy="90" r="3"></circle><circle class="pt" cx="190.7" cy="90" r="3"></circle><circle class="pt" cx="215.8" cy="72.5" r="3"></circle><circle class="pt" cx="240.9" cy="72.5" r="3"></circle><circle class="pt" cx="266" cy="55" r="3"></circle><circle class="pt" cx="291.1" cy="55" r="3"></circle>
        <use class="star" href="#star" x="306" y="18" width="20" height="20"></use>
        <text class="tx" x="40" y="156" text-anchor="middle">9月</text>
        <text class="tx" x="165" y="156" text-anchor="middle">10月</text>
        <text class="tx" x="266" y="156" text-anchor="middle">11月</text>
      </svg>
    </div>
    <div class="pbl"><em class="pb"><svg class="i f" aria-hidden="true" style="width:13px;height:13px"><use href="#star"></use></svg>自己ベスト</em><span><b>62.5 kg</b> 合計 × 10　<span class="sub">今日</span></span></div>
    <div class="rec">
      <button type="button"><b>今日（11/14）<i class="tag">記録中</i></b><small>62.5 kg 合計 × 10 · 9 · リストラップ</small></button>
      <button type="button"><b>11/7（土）</b><small>60 kg 合計 × 10 · 9 · 8 · リストラップ</small></button>
      <button type="button"><b>11/2（月）</b><small>60 kg 合計 × 9 · 8 · 8 · リストラップ</small></button>
      <button type="button"><b>10/26（月）</b><small>57.5 kg 合計 × 10 · 10 · 9 · リストラップ</small></button>
    </div>
  </div>
  <div class="foot"><button type="button" class="btn fill">記録にもどる</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
