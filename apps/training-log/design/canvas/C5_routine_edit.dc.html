<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — ルーティン編集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden;padding:0 16px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px;text-align:center}
.btn.tone{background:var(--con);color:var(--oncon)}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.field{display:block;min-height:56px;border:1.5px solid var(--line);border-radius:12px;padding:5px 14px;margin-bottom:8px;background:var(--sf)}
.field span{display:block;font-size:12px;color:var(--sub)}
.field input{width:100%;border:0;background:transparent;font:inherit;font-size:16px;color:var(--fg);padding:1px 0}
.field input::placeholder{color:var(--sub)}
.h{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:6px 4px 6px}
.ex{background:var(--sf);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.ex .hd{display:flex;align-items:center;min-height:64px}
.ex .hd .nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:64px}
.ex .hd .nm b{display:block;font-size:15px}
.ex .hd .nm small{font-size:12px;color:var(--sub)}
.ex .hd .nm .chip{align-self:flex-start;font-size:11px;font-weight:700;background:var(--con);color:var(--oncon);border-radius:6px;padding:0 6px;margin-top:2px}
.tg{display:flex;align-items:center;min-height:48px;padding:0 8px 0 16px;border-top:1px solid var(--line)}
.tg .l{flex:1;font-size:14px}
.tg .pm{width:44px;height:44px;border-radius:12px;background:var(--sf2);display:grid;place-items:center;flex:none}
.tg .v{width:76px;text-align:center;font-size:19px;font-weight:700}
.tg .v small{font-size:12px;font-weight:400;color:var(--sub);margin-left:3px}
.foot{flex:none;padding:6px 16px 14px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="more" viewBox="0 0 24 24"><path d="M12 5h.01M12 12h.01M12 19h.01" stroke-width="3"></path></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"></path></symbol>
  <symbol id="up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"></path></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="戻る"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">Pull を編集</div>
    <button type="button" class="ib" aria-label="メニュー"><svg class="i" aria-hidden="true"><use href="#more"></use></svg></button>
  </div>
  <div class="scr">
    <label class="field"><span>名前</span><input type="text" value="Pull"></label>
    <label class="field"><span>メモ（記録中に見られます）</span><input type="text" placeholder="例: ベンチが空いていなければダンベルプレスに変更"></label>
    <div class="h">種目</div>
    <div class="ex">
      <div class="hd">
        <button type="button" class="ib" aria-label="ラットプルダウンを並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
        <div class="nm"><b>ラットプルダウン</b><small>マシン · 目標と休憩を設定中</small></div>
        <button type="button" class="ib" aria-label="目標をとじる"><svg class="i" aria-hidden="true"><use href="#up"></use></svg></button>
      </div>
      <div class="tg"><span class="l">セット数</span><button type="button" class="pm" aria-label="セット数を減らす"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><span class="v">3</span><button type="button" class="pm" aria-label="セット数を増やす"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
      <div class="tg"><span class="l">重量<i class="tag" style="margin-left:6px">合計</i></span><button type="button" class="pm" aria-label="重量を下げる"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><span class="v">55<small>kg</small></span><button type="button" class="pm" aria-label="重量を上げる"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
      <div class="tg"><span class="l">回数</span><button type="button" class="pm" aria-label="回数を減らす"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><span class="v">12<small>回</small></span><button type="button" class="pm" aria-label="回数を増やす"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
      <div class="tg"><span class="l">休憩（セット間）</span><button type="button" class="pm" aria-label="セット間の休憩を短くする"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><span class="v">1:30</span><button type="button" class="pm" aria-label="セット間の休憩を長くする"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
      <div class="tg"><span class="l">休憩（種目のあと）</span><button type="button" class="pm" aria-label="種目のあとの休憩を短くする"><svg class="i" aria-hidden="true"><use href="#minus"></use></svg></button><span class="v">2:00</span><button type="button" class="pm" aria-label="種目のあとの休憩を長くする"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg></button></div>
    </div>
    <div class="ex">
      <div class="hd">
        <button type="button" class="ib" aria-label="ワンハンドダンベルロウを並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
        <button type="button" class="nm"><b>ワンハンドダンベルロウ</b><small>ダンベル · 3 セット × 26 kg 片手 × 10 回 片側</small><small>休憩 1:30 · 種目のあと 2:00</small><span class="chip">フォームは当日に選ぶ</span></button>
        <button type="button" class="ib" aria-label="ワンハンドダンベルロウの目標をひらく"><svg class="i" aria-hidden="true"><use href="#down"></use></svg></button>
      </div>
    </div>
    <div class="ex">
      <div class="hd">
        <button type="button" class="ib" aria-label="懸垂を並べ替える"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></button>
        <button type="button" class="nm"><b>懸垂</b><small>自重 · 3 セット × 8 回</small><small>休憩は設定のとおり</small></button>
        <button type="button" class="ib" aria-label="懸垂の目標をひらく"><svg class="i" aria-hidden="true"><use href="#down"></use></svg></button>
      </div>
    </div>
  </div>
  <div class="foot"><button type="button" class="btn tone"><svg class="i" aria-hidden="true"><use href="#plus"></use></svg>種目を追加</button></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
