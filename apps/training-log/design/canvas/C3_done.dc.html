<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — ワークアウト完了</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden;padding:0 16px}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.pb{display:inline-flex;align-items:center;gap:2px;font-style:normal;font-size:11px;font-weight:700;border:1.5px solid var(--fg);border-radius:999px;padding:1px 7px 1px 4px;white-space:nowrap}
.pb .i{width:13px;height:13px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px;text-align:center}
.btn.fill{background:var(--pri);color:var(--onpri)}
.btn.line{border:1.5px solid var(--line)}
.top{display:flex;align-items:baseline;gap:10px;padding:4px 4px 12px}
.top b{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stats div{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stats small{display:block;font-size:12px;color:var(--sub)}
.stats b{font-size:20px}
.stats span{font-size:11px;color:var(--sub);margin-left:2px}
.h{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em;margin:0 4px 6px}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;margin-bottom:16px}
.row{display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px}
.row .t small{font-size:12px;color:var(--sub)}
.fld{min-height:56px;border:1.5px solid var(--line);border-radius:12px;padding:14px;color:var(--sub);font-size:14px;margin-bottom:12px}
.acts{display:flex;flex-direction:column;gap:8px;padding:8px 16px 16px;flex:none}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.2 6.1-5.5-3-5.5 3 1.2-6.1-4.5-4.2 6.1-.8z"></path></symbol>
  <symbol id="list" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="記録にもどる"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">おつかれさま</div>
  </div>
  <div class="scr">
    <div class="top"><b>Push</b><span class="sub">11月14日（土）</span></div>
    <div class="stats">
      <div><small>時間</small><b>27</b><span>分</span></div>
      <div><small>種目</small><b>2</b></div>
      <div><small>セット</small><b>6</b></div>
      <div><small>ボリューム</small><b>2,910</b><span>kg</span></div>
    </div>
    <div class="h">自己ベスト</div>
    <div class="card">
      <div class="row"><em class="pb"><svg class="i f" aria-hidden="true"><use href="#star"></use></svg>自己ベスト</em><div class="t"><b>ベンチプレス　62.5 kg <i class="tag">合計</i> × 10</b><small>最大重量の更新 · これまで 60 kg</small></div></div>
    </div>
    <div class="h">種目ごと</div>
    <div class="card">
      <div class="row"><div class="t"><b>ベンチプレス</b><small>62.5 kg 合計 × 10 · 9 · 9 · リストラップ</small></div></div>
      <div class="row"><div class="t"><b>インクラインダンベルプレス</b><small>20 kg 片手 × 10 · 10 · 9 · ベンチ角度 30°</small></div></div>
    </div>
    <div class="h">ワークアウトのメモ</div>
    <div class="fld">今日の記録にメモを書く</div>
  </div>
  <div class="acts">
    <button type="button" class="btn line"><svg class="i" aria-hidden="true"><use href="#list"></use></svg>ルーティンとして保存</button>
    <button type="button" class="btn fill" style="min-height:60px;font-size:18px">ホームにもどる</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
