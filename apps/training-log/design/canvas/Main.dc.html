<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A ノート — ホーム</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{width:360px;height:780px;overflow:hidden;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dA{--bg:#F6F4EC;--sf:#FFFFFF;--sf2:#ECE9DD;--fg:#1C1F1A;--sub:#55594F;--pri:#2F5D3A;--onpri:#FFFFFF;--con:#D5E6D2;--oncon:#12301B;--line:#C9C6B8}
.app.dA.dark{--bg:#141612;--sf:#1E211C;--sf2:#2A2E27;--fg:#E6E4DA;--sub:#A9AD9F;--pri:#A5D0A8;--onpri:#0F2A16;--con:#2B4531;--oncon:#CFE8CF;--line:#40443C}
.scr{flex:1;overflow:hidden;min-height:0}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.i.s{width:18px;height:18px}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.bar .time{font-size:15px;color:var(--sub);padding-right:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none;color:var(--fg)}
.tb{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pri);border-radius:999px;white-space:nowrap}
.sub{color:var(--sub)}
.tag{font-size:11px;font-style:normal;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--sub);white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px}
.btn.fill{background:var(--pri);color:var(--onpri)}
.btn.line{border:1.5px solid var(--line);color:var(--fg)}
.nav{height:72px;flex:none;display:flex;background:var(--sf);border-top:1px solid var(--line)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub)}
.nav div span{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav .on{color:var(--fg);font-weight:700}
.nav .on span{background:var(--con);color:var(--oncon)}
.h{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.04em}
.hint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);min-height:48px}
.hint u{color:var(--pri);font-weight:700;text-decoration:none;margin-left:auto;white-space:nowrap}
.dA .hero{margin:4px 16px 12px;background:var(--con);color:var(--oncon);border-radius:24px;padding:18px}
.dA .hero h3{font-size:30px;margin:2px 0}
.dA .hero p{font-size:13px;margin-bottom:14px}
.dA .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dA .sec{margin:0 16px 12px}
.dA .box{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:6px}
.dA .box .l1{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.dA .li{display:flex;align-items:center;min-height:48px;border-top:1px solid var(--line)}
.dA .li:first-child{border-top:0}
.dA .li b{flex:1;font-size:15px}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"></path></symbol>
  <symbol id="right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></symbol>
  <symbol id="export" viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 14v5h14v-5"></path></symbol>
  <symbol id="home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"></path></symbol>
  <symbol id="cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></symbol>
  <symbol id="tune" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"></path><circle cx="15" cy="7" r="2"></circle><circle cx="9" cy="17" r="2"></circle></symbol>
</svg>
<div class="app dA {{themeClass}}">
  <div class="bar"><div class="ttl" style="padding-left:16px">今日 <span class="sub" style="font-size:14px;font-weight:400">11月14日（土）</span></div></div>
  <div class="scr">
    <div class="hero">
      <div style="font-size:12px;font-weight:700">次のルーティン</div>
      <h3>Push</h3>
      <p>ベンチプレス、インクラインダンベルプレス<br>前回の Push: 11/7（土）</p>
      <div class="btn fill"><svg class="i f"><use href="#play"></use></svg>Push を始める</div>
    </div>
    <div class="sec two">
      <div class="btn line" style="font-size:14px">ルーティンから選ぶ</div>
      <div class="btn line" style="font-size:14px">自由に記録</div>
    </div>
    <div class="sec">
      <div class="h">前回のワークアウト</div>
      <div class="box">
        <div class="l1"><span>Legs</span><span class="sub" style="font-weight:400;font-size:13px">11/12（木）・48 分</span></div>
        <div class="sub" style="font-size:13px;margin-top:4px">スクワット 80 kg <i class="tag">合計</i> × 8 を 3 セット<br>プランク 60 秒 を 2 セット</div>
        <div style="font-size:13px;margin-top:6px">2 種目・5 セット・ボリューム 1,920 kg</div>
      </div>
    </div>
    <div class="sec">
      <div class="h">ルーティン</div>
      <div class="box" style="padding:0 4px 0 14px">
        <div class="li"><b>Push</b><span class="sub" style="font-size:13px">2 種目</span><svg class="i sub"><use href="#right"></use></svg></div>
        <div class="li"><b>Pull</b><span class="sub" style="font-size:13px">3 種目</span><svg class="i sub"><use href="#right"></use></svg></div>
      </div>
    </div>
    <div class="sec hint"><svg class="i s"><use href="#export"></use></svg>最後の書き出しから 32 日<u>書き出す</u></div>
  </div>
  <div class="nav">
    <div class="on"><span><svg class="i"><use href="#home"></use></svg></span>今日</div>
    <div><span><svg class="i"><use href="#cal"></use></svg></span>履歴</div>
    <div><span><svg class="i"><use href="#tune"></use></svg></span>設定</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
