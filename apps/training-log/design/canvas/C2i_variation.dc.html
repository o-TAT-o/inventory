<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C ドック — 記録（フォームを選ぶ）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;color:inherit;background:none;border:0;text-align:inherit;cursor:pointer}
.app{--bg:#F4F6F9;--sf:#FFFFFF;--sf2:#E4E9F0;--fg:#141A22;--sub:#4D5766;--pri:#1F3A5F;--onpri:#FFFFFF;--con:#D6E3F5;--oncon:#0D2440;--line:#C5CCD6;--err:#BA1A1A;--inv:#2B3340;--oninv:#F1F3F7;--invact:#A9C7F0;width:360px;height:780px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans JP','Yu Gothic UI',sans-serif;font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
.app.dark{color-scheme:dark;--bg:#0F1318;--sf:#181D24;--sf2:#242B34;--fg:#E4E8EE;--sub:#9DA7B5;--pri:#A9C7F0;--onpri:#0B2748;--con:#263B56;--oncon:#D6E3F5;--line:#38414D;--err:#FFB4AB;--inv:#E4E8EE;--oninv:#141A22;--invact:#1F3A5F}
.scr{flex:1;min-height:0;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}
.sub{color:var(--sub)}
.bar{height:56px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px}
.bar .ttl{font-size:20px;font-weight:600;flex:1;padding-left:4px}
.bar .time{font-size:15px;color:var(--sub);padding-right:4px}
.ib{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;flex:none}
.tb{min-height:48px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--pri);border-radius:999px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:16px;font-size:16px;font-weight:700;padding:0 20px;text-align:center}
.btn.fill{background:var(--pri);color:var(--onpri)}
.sum{display:flex;align-items:center;padding:0 12px 0 4px;border-bottom:1px solid var(--line)}
.sum .sb{flex:1;min-width:0;min-height:56px;display:flex;flex-direction:column;justify-content:center}
.sum .sb b{font-size:15px}
.sum .sb small{font-size:12px;color:var(--sub)}
.sum .ok{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.eh{display:flex;align-items:center;padding:6px 0 2px 4px}
.eh .nm{flex:1;min-width:0}
.eh .nm b{font-size:15px;display:block}
.eh .nm small{font-size:12px;color:var(--sub);display:block}
.r{display:grid;grid-template-columns:28px 1fr auto;align-items:center;width:calc(100% - 24px);min-height:44px;margin:0 12px;padding:0 8px;font-size:15px;border-radius:10px;color:var(--sub)}
.r .no{font-size:13px}
.ring{width:18px;height:18px;border:2px solid var(--line);border-radius:50%}
.scrim{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;height:430px;background:var(--sf);border-radius:28px 28px 0 0;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.grab{width:32px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.sh{display:flex;align-items:center;min-height:48px}
.sh .t{flex:1;min-width:0}
.sh .t b{display:block;font-size:18px}
.sh .t small{font-size:13px;color:var(--sub)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;min-height:76px;padding:14px;border:1.5px solid var(--line);border-radius:16px;cursor:pointer}
.opt input{width:22px;height:22px;margin-top:2px;accent-color:var(--pri);flex:none}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:16px}
.opt .t small{display:block;font-size:13px;color:var(--sub)}
.opt.on{background:var(--con);border-color:transparent;color:var(--oncon)}
.opt.on .t small{color:var(--oncon)}
.addf{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 6px;font-weight:700;color:var(--pri)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></symbol>
  <symbol id="drag" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"></path></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></symbol>
  <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
  <symbol id="down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></symbol>
</svg>
<div class="app {{themeClass}}">
  <div class="bar">
    <button type="button" class="ib" aria-label="戻る"><svg class="i" aria-hidden="true"><use href="#back"></use></svg></button>
    <div class="ttl">Pull</div><div class="time">14:20</div>
    <button type="button" class="tb">終える</button>
  </div>
  <div class="scr">
    <div class="sum">
      <span class="ib"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></span>
      <div class="sb"><b>ラットプルダウン</b><small>55 kg 合計 × 12 · 12 · 11</small></div>
      <span class="ok"><svg class="i s" aria-hidden="true"><use href="#check"></use></svg>3/3</span>
    </div>
    <div class="eh">
      <span class="ib"><svg class="i sub" aria-hidden="true"><use href="#drag"></use></svg></span>
      <div class="nm"><b>ワンハンドダンベルロウ</b><small>ダンベル · 重量は片手 · 回数は片側</small><small>フォーム: 未選択</small></div>
    </div>
    <div class="r"><span class="no">1</span><span>26 kg × 10 回</span><span class="ring"></span></div>
    <div class="r"><span class="no">2</span><span>26 kg × 10 回</span><span class="ring"></span></div>
    <div class="r"><span class="no">3</span><span>26 kg × 10 回</span><span class="ring"></span></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="sh">
      <div class="t"><b>ワンハンドダンベルロウ</b><small>どのフォームでやりますか？</small></div>
      <button type="button" class="ib" aria-label="とじる"><svg class="i" aria-hidden="true"><use href="#down"></use></svg></button>
    </div>
    <div class="opts" role="radiogroup" aria-label="フォーム">
      <label class="opt on"><input type="radio" name="form" checked><span class="t"><b>膝をベンチにつく</b><small>前回 11/11　26 kg 片手 × 10 を 3 セット</small></span></label>
      <label class="opt"><input type="radio" name="form"><span class="t"><b>立って背もたれに手をつく</b><small>まだ記録がありません</small><small>「膝をベンチにつく」の直近: 26 kg 片手 × 10</small></span></label>
    </div>
    <button type="button" class="addf"><svg class="i s" aria-hidden="true"><use href="#plus"></use></svg>フォームを追加</button>
    <button type="button" class="btn fill">このフォームで始める</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() {
    return { themeClass: this.props.dark ? 'dark' : '' };
  }
}
</script>
</body>
</html>
